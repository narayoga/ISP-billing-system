server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Kompresi aset teks
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Aset ber-hash dari Vite → boleh di-cache lama
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: semua route (mis. /admin/customers/1) dilayani index.html
    # supaya React Router menangani sendiri — tanpa ini refresh halaman → 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html tidak boleh di-cache agar deploy baru langsung terlihat
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
