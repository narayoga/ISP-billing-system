# =====================================================================
# Backend produksi untuk VPS.
#
# Topologi:
#
#   Cloudflare (frontend React)  ─── HTTPS ──▶  nginx di VPS
#                                                  ├─▶ api     :8080  (Node)
#                                                  └─▶ billing :8081  (Go)
#                                               jaringan privat Docker:
#                                                  Postgres · Redis · volume bukti
#
# Frontend TIDAK termasuk di sini — di-host Cloudflare (lihat catatan di
# bawah service `frontend`).
#
# Urutan penggunaan:
#   cp .env.prod.example .env.prod     # lalu isi semua secret
#   docker compose --env-file .env.prod -f docker-compose.prod.yml build
#   docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm billing migrate up
#   docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm billing seed-admin
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
#
# Port api & billing sengaja terikat ke 127.0.0.1 — hanya dapat dijangkau
# nginx di host, tidak dari internet. Postgres dan Redis tidak diekspos
# sama sekali; keduanya hanya hidup di jaringan privat Docker.
# =====================================================================

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      # Postgres 18+ menyimpan data di subdirektori per-versi, jadi volume
      # dipasang di /var/lib/postgresql (bukan .../data seperti versi lama).
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    image: ghcr.io/narayoga/isp-api-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PORT: 8080
      TZ: ${TZ:-Asia/Jakarta}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Dasar URL tautan tagihan yang dikirim ke pelanggan (PRD v3.0).
      # WAJIB diisi domain publik — bila kosong, kode jatuh ke
      # http://localhost:5173 dan setiap tautan di WhatsApp/email tidak
      # bisa dibuka pelanggan.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      BILLING_BASE_URL: http://billing:8081
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      UPLOAD_DIR: /var/lib/isp/uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-2097152}
      EMAIL_FROM: ${EMAIL_FROM}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      # WhatsApp (Wablas) — kanal notifikasi utama. Bila WABLAS_TOKEN kosong,
      # kanal ini mati diam-diam dan notifikasi hanya lewat email.
      WABLAS_BASE_URL: ${WABLAS_BASE_URL:-https://smg.wablas.com}
      WABLAS_TOKEN: ${WABLAS_TOKEN}
      WABLAS_SECRET: ${WABLAS_SECRET}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
    volumes:
      - uploads-data:/var/lib/isp/uploads
    # Terikat ke 127.0.0.1 saja: hanya nginx di host yang boleh menjangkau.
    # Tanpa awalan ini, port terbuka ke seluruh internet dan pengunjung bisa
    # melewati reverse proxy beserta TLS-nya.
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"

  billing:
    image: ghcr.io/narayoga/isp-billing-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      PORT: 8081
      TZ: ${TZ:-Asia/Jakarta}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Dipakai menyusun tautan tagihan pada notifikasi cron (terbit,
      # reminder H-3, jatuh tempo, isolir). Sama nilainya dengan service api.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      REDIS_URL: redis://redis:6379
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      MIKROTIK_HOST: ${MIKROTIK_HOST}
      MIKROTIK_PORT: ${MIKROTIK_PORT:-8728}
      MIKROTIK_USER: ${MIKROTIK_USER}
      MIKROTIK_PASSWORD: ${MIKROTIK_PASSWORD}
      MIKROTIK_MOCK: ${MIKROTIK_MOCK:-false}
      EMAIL_FROM: ${EMAIL_FROM}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      WABLAS_BASE_URL: ${WABLAS_BASE_URL:-https://smg.wablas.com}
      WABLAS_TOKEN: ${WABLAS_TOKEN}
      WABLAS_SECRET: ${WABLAS_SECRET}
      ALERT_EMAIL: ${ALERT_EMAIL}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Super Admin}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Sama seperti api: hanya nginx di host yang boleh menjangkau.
    # Webhook dari Mikrotik pun masuk lewat nginx (HTTPS), bukan langsung
    # ke port ini.
    ports:
      - "127.0.0.1:${BILLING_PORT:-8081}:8081"

  # ---------------------------------------------------------------------
  # Frontend TIDAK dijalankan di sini.
  #
  # Aplikasi React di-host di Cloudflare (build otomatis dari repo), sehingga
  # VPS hanya melayani backend. Ini menghemat sumber daya server sekaligus
  # memanfaatkan CDN Cloudflare untuk aset statis.
  #
  # Bila suatu saat ingin menjalankannya sendiri di VPS (mis. Cloudflare
  # bermasalah), Dockerfile dan nginx.conf di isp-frontend/ masih tersedia dan
  # sudah teruji build — jalankan dengan profile:
  #
  #   docker compose --profile with-frontend ... up -d
  # ---------------------------------------------------------------------
  frontend:
    profiles: ["with-frontend"]
    build:
      context: ./isp-frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_BILLING_BASE_URL: ${VITE_BILLING_BASE_URL}
        VITE_BANK_NAME: ${VITE_BANK_NAME}
        VITE_BANK_ACCOUNT: ${VITE_BANK_ACCOUNT}
        VITE_BANK_HOLDER: ${VITE_BANK_HOLDER}
    restart: unless-stopped
    depends_on: [api, billing]
    ports:
      - "${FRONTEND_PORT:-8090}:80"

volumes:
  postgres-data:
  redis-data:
  uploads-data:
